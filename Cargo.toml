[package]
name = "code2llm-rust"
version = "0.1.0"
edition = "2021"
authors = ["Tom Sapletta <tom@sapletta.com>"]
description = "High-performance native Rust acceleration engine for code2llm"
readme = "README.md"
license = "Apache-2.0"

[lib]
name = "code2llm_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
ignore = "0.4.33"
pyo3 = { version = "0.23", features = ["extension-module"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
walkdir = "2.5.0"
